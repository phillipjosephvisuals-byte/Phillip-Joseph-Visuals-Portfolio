<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protocol Zero: Secure Data Handling & Threat Verification</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --panel-bg: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --primary: #58a6ff;
      --primary-hover: #1f6feb;
      --success: #2ea043;
      --warning: #d29922;
      --danger: #f85149;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      line-height: 1.5;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header & Progress Bar */
    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .module-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      background: rgba(88, 166, 255, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(88, 166, 255, 0.2);
    }

    .score-badge {
      font-size: 0.85rem;
      font-family: var(--mono);
      color: var(--text-bright);
    }

    .progress-bar-container {
      height: 6px;
      background: var(--panel-bg);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.4s ease;
    }

    /* Main Viewport */
    .viewport {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .node-header {
      margin-bottom: 16px;
    }

    .node-title {
      color: var(--text-bright);
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .node-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Mock Components (Email, Sandbox, Forms) */
    .mock-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin: 16px 0;
      overflow: hidden;
    }

    .mock-header {
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      font-family: var(--mono);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mock-header-row {
      display: flex;
      gap: 8px;
    }

    .mock-header-label {
      color: var(--text-muted);
      width: 60px;
    }

    .mock-header-value {
      color: var(--text-bright);
    }

    .mock-body {
      padding: 16px;
      font-size: 0.95rem;
      color: var(--text);
    }

    .mock-link {
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
      word-break: break-all;
    }

    /* Tool Tabs / Investigation Desk */
    .tool-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .tool-tab-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tool-tab-btn:hover {
      border-color: var(--text-muted);
    }

    .tool-tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    .tool-tab-content {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    /* Action Option Buttons */
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .option-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 14px 18px;
      border-radius: 6px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:hover {
      background: rgba(88, 166, 255, 0.08);
      border-color: var(--primary);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-bright);
      font-family: inherit;
      font-size: 0.9rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Callout & Feedback Banners */
    .banner {
      padding: 14px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .banner-danger {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      color: #ff7b72;
    }

    .banner-warning {
      background: rgba(210, 153, 34, 0.1);
      border: 1px solid rgba(210, 153, 34, 0.3);
      color: #e3b341;
    }

    .banner-success {
      background: rgba(46, 160, 67, 0.1);
      border: 1px solid rgba(46, 160, 67, 0.3);
      color: #56d364;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* Telemetry Drawer (xAPI / SCORM Log) */
    .telemetry-drawer {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    .telemetry-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .telemetry-log {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .telemetry-entry {
      color: #7ee787;
    }
    .telemetry-entry.warn {
      color: #f2cc60;
    }
    .telemetry-entry.fail {
      color: #ff7b72;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="header-top">
        <span class="module-badge">SOC Simulation • Level 2 Evaluation</span>
        <span class="score-badge">Integrity Score: <strong id="score-display">100</strong>%</span>
      </div>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
    </header>

    <!-- Main Viewport Area -->
    <main id="viewport" class="viewport" role="region" aria-live="polite">
      <!-- Injected via JavaScript state machine -->
    </main>

    <!-- Telemetry Console (SCORM/xAPI Statement Visualizer) -->
    <section class="telemetry-drawer" aria-label="Learning Analytics Telemetry">
      <div class="telemetry-title">
        <span>xAPI Telemetry & LRS Dispatch Stream</span>
        <span id="lrs-status" style="color: #58a6ff;">● Connected</span>
      </div>
      <div id="telemetry-log" class="telemetry-log"></div>
    </section>
  </div>

  <script>
    // --- STATE ENGINE & DATA ARCHITECTURE ---
    const state = {
      currentNode: 'intro',
      score: 100,
      evidenceGathered: {
        headerChecked: false,
        urlInspected: false,
        slackVerified: false
      },
      history: []
    };

    function logTelemetry(verb, object, result = null, type = 'info') {
      const logContainer = document.getElementById('telemetry-log');
      const entry = document.createElement('div');
      entry.className = `telemetry-entry ${type}`;
      const timestamp = new Date().toISOString().split('T')[1].slice(0, 8);
      
      let payload = `[${timestamp}] xAPI: actor(learner) -> ${verb.toUpperCase()} -> "${object}"`;
      if (result) payload += ` [result: ${JSON.stringify(result)}]`;
      
      entry.textContent = payload;
      logContainer.prepend(entry);
    }

    function updateHeader(progressPercent) {
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;
      document.getElementById('score-display').textContent = Math.max(0, state.score);
    }

    // --- NODE DEFINITIONS ---
    const nodes = {
      intro: {
        title: "Protocol Zero: Threat Verification Simulation",
        desc: "Scenario-based training for administrative and operations personnel.",
        render: () => `
          <div>
            <div class="node-header">
              <h1 class="node-title">Protocol Zero: Secure Data Handling</h1>
              <p class="node-desc">Target Competency: Out-of-band verification and credential threat mitigation.</p>
            </div>
            <div class="mock-card">
              <div class="mock-body">
                <p><strong>Operational Context:</strong> You are the Lead Operations Specialist for Meridian Health Logistics. It is 8:45 AM on Friday. You are preparing to run scheduled payroll and contractor invoices.</p>
                <br>
                <p>In this simulation, you will encounter high-pressure data requests. You will be evaluated on your ability to spot social-engineering indicators, verify channels out-of-band, and protect employee Personally Identifiable Information (PII).</p>
              </div>
            </div>
          </div>
          <button class="btn-primary" onclick="goToNode('node1_email')">Initialize Scenario →</button>
        `,
        onEnter: () => {
          updateHeader(10);
          logTelemetry('initialized', 'Protocol Zero Course Player');
        }
      },

      node1_email: {
        title: "High-Priority Task: Incoming Audit Request",
        desc: "Review the incoming communication in your corporate mailbox.",
        render: () => `
          <div>
            <div class="node-header">
              <h2 class="node-title">Incoming Request: Mail Client</h2>
              <p class="node-desc">Analyze the message below and determine the proper operational response.</p>
            </div>

            <div class="mock-card">
              <div class="mock-header">
                <div class="mock-header-row"><span class="mock-header-label">From:</span><span class="mock-header-value">Marcus Vance &lt;m.vance@meridian-exec-portal.com&gt;</span></div>
                <div class="mock-header-row"><span class="mock-header-label">To:</span><span class="mock-header-value">operations-team@meridianhealth.com</span></div>
                <div class="mock-header-row"><span class="mock-header-label">Subject:</span><span class="mock-header-value">URGENT: Q3 Compliance Audit – Contractor SSN & Direct Deposit Export Required</span></div>
              </div>
              <div class="mock-body">
                <p>Team,</p>
                <br>
                <p>External Compliance Auditors just flagged an incomplete roster for our Q3 contingent staff filing. I am currently boarding a flight to Chicago and cannot jump on a phone call.</p>
                <br>
                <p>Please immediately export the <code>Q3_Contractor_Payroll.csv</code> roster (including full SSNs and banking details) and upload it to the secure external auditor container below before the 10:00 AM filing deadline:</p>
                <br>
                <p><span class="mock-link">https://secure-audit.meridian-compliance-review.net/drop/q3-tax</span></p>
                <br>
                <p>Regards,<br><strong>Marcus Vance</strong><br>Vice President of Enterprise Operations</p>
              </div>
            </div>

            <div class="options-group">
              <button class="option-btn" onclick="goToNode('branch_breach')">
                <span><strong>Action 1:</strong> Fulfill request immediately to avoid regulatory non-compliance penalty</span>
                <span>→</span>
              </button>
              <button class="option-btn" onclick="goToNode('branch_reply')">
                <span><strong>Action 2:</strong> Reply directly to the email requesting secondary managerial authorization</span>
                <span>→</span>
              </button>
              <button class="option-btn" onclick="goToNode('node2_investigate')">
                <span><strong>Action 3:</strong> Withhold data export and open Investigation Desk</span>
                <span>→</span>
              </button>
            </div>
          </div>
        `,
        onEnter: () => {
          updateHeader(30);
          logTelemetry('encountered', 'Node 1: Phishing Email Prompt');
        }
      },

      branch_breach: {
        title: "CRITICAL BREACH: Data Exfiltration Alert",
        desc: "Consequence Demonstration Path",
        render: () => `
          <div>
            <div class="banner banner-danger">
              <strong>SECURITY INCIDENT OCCURRED:</strong> 184 Employee/Contractor PII records exfiltrated.
            </div>
            <div class="mock-card">
              <div class="mock-body">
                <p><strong>Root Cause Analysis:</strong></p>
                <ul style="margin-left: 20px; margin-top: 8px;">
                  <li>The link pointed to a spoofed lookalike domain (<code>meridian-compliance-review.net</code>) not registered to company IT assets.</li>
                  <li>Artificial urgency ("boarding a flight", "10:00 AM deadline") was leveraged to bypass standard verification SOPs.</li>
                </ul>
                <br>
                <p><strong>Remediation Required:</strong> You must complete incident reporting to prevent credential harvesting across the network.</p>
              </div>
            </div>
          </div>
          <button class="btn-primary" onclick="goToNode('node2_investigate', -35)">Initiate Containment & Re-Evaluate →</button>
        `,
        onEnter: () => {
          updateHeader(45);
          logTelemetry('failed', 'Direct Upload Selected', { penalty: -35 }, 'fail');
        }
      },

      branch_reply: {
        title: "Communication Trap: In-Channel Confirmation",
        desc: "Protocol Warning",
        render: () => `
          <div>
            <div class="banner banner-warning">
              <strong>PROTOCOL WARNING: In-Band Communication Trap</strong>
            </div>
            <div class="mock-card">
              <div class="mock-header">
                <div class="mock-header-row"><span class="mock-header-label">From:</span><span class="mock-header-value">Marcus Vance &lt;m.vance@meridian-exec-portal.com&gt;</span></div>
                <div class="mock-header-row"><span class="mock-header-label">Subject:</span><span class="mock-header-value">RE: URGENT: Q3 Compliance Audit...</span></div>
              </div>
              <div class="mock-body">
                <p><em>"This is Marcus. Yes, I am officially approving this release via mobile. Upload the file immediately or our department will incur regulatory fines."</em></p>
                <hr style="border: 0; border-top: 1px solid var(--border); margin: 12px 0;">
                <p><strong>Instructional Feedback:</strong> Replying directly to an attacker-controlled thread provides zero verification value because the adversary controls the receiving mailbox. <strong>Always verify out-of-band</strong> using known internal channels.</p>
              </div>
            </div>
          </div>
          <button class="btn-primary" onclick="goToNode('node2_investigate', -15)">Open Security Investigation Desk →</button>
        `,
        onEnter: () => {
          updateHeader(45);
          logTelemetry('warned', 'In-Band Reply Selected', { penalty: -15 }, 'warn');
        }
      },

      node2_investigate: {
        title: "Security Investigation Desk",
        desc: "Inspect artifacts across independent verification channels.",
        render: () => `
          <div>
            <div class="node-header">
              <h2 class="node-title">Security Investigation Desk</h2>
              <p class="node-desc">Examine the three verification sources before submitting your final incident action.</p>
            </div>

            <div class="tool-tabs" role="tablist">
              <button id="tab-btn-header" class="tool-tab-btn" onclick="switchToolTab('header')">1. Header Inspector</button>
              <button id="tab-btn-url" class="tool-tab-btn" onclick="switchToolTab('url')">2. Domain Sandbox</button>
              <button id="tab-btn-slack" class="tool-tab-btn" onclick="switchToolTab('slack')">3. Internal Directory (Slack)</button>
            </div>

            <div id="tool-tab-display" class="tool-tab-content">
              <!-- Dynamically switched -->
            </div>

            <div class="options-group">
              <button id="btn-escalate" class="option-btn" style="border-color: var(--primary);" onclick="goToNode('node3_soc_report')">
                <span><strong>Proceed:</strong> File Incident Report & Block Attacker Domain</span>
                <span>→</span>
              </button>
            </div>
          </div>
        `,
        onEnter: () => {
          updateHeader(70);
          setTimeout(() => switchToolTab('header'), 50);
          logTelemetry('accessed', 'Investigation Desk Tools');
        }
      },

      node3_soc_report: {
        title: "SOC Form 104: Incident Escalation",
        desc: "Complete the triage report based on verified evidence.",
        render: () => `
          <div>
            <div class="node-header">
              <h2 class="node-title">SOC Triage Submission</h2>
              <p class="node-desc">Synthesize your findings for the Security Operations Center queue.</p>
            </div>

            <form id="soc-form" onsubmit="handleSocSubmit(event)">
              <div class="form-group">
                <label for="threat-type">Identified Threat Category</label>
                <select id="threat-type" class="form-control" required>
                  <option value="">Select threat type...</option>
                  <option value="spam">Unsolicited Commercial Spam</option>
                  <option value="spear_phishing">Executive Impersonation / Spear Phishing</option>
                  <option value="ransomware">Malware / Ransomware Delivery</option>
                </select>
              </div>

              <div class="form-group">
                <label for="indicator">Primary Technical Indicator</label>
                <select id="indicator" class="form-control" required>
                  <option value="">Select primary indicator...</option>
                  <option value="mismatched_domain">Spoofed Top-Level Domain (meridian-exec-portal.com vs meridianhealth.com)</option>
                  <option value="attachment">Malicious Macro Attachment</option>
                  <option value="server_down">Internal Server Outage</option>
                </select>
              </div>

              <div class="form-group">
                <label for="verification-channel">Required Verification Action Taken</label>
                <select id="verification-channel" class="form-control" required>
                  <option value="">Select action taken...</option>
                  <option value="phone">Wait for user to call back</option>
                  <option value="out_of_band">Out-of-band confirmation via authenticated internal chat/directory</option>
                  <option value="ignore">Delete email and take no further action</option>
                </select>
              </div>

              <button type="submit" class="btn-primary" style="margin-top: 10px;">Submit Incident Escalation</button>
            </form>
          </div>
        `,
        onEnter: () => {
          updateHeader(85);
          logTelemetry('initiated', 'SOC Incident Triage Form');
        }
      },

      node_complete: {
        title: "Module Complete: Operational Clearance",
        desc: "Assessment Results and Performance Metrics",
        render: () => {
          const pass = state.score >= 80;
          return `
            <div>
              <div class="banner ${pass ? 'banner-success' : 'banner-warning'}">
                <strong>${pass ? 'SIMULATION PASSED: Mastery Demonstrated' : 'SIMULATION COMPLETE: Remediation Recommended'}</strong>
              </div>

              <div class="node-header">
                <h2 class="node-title">Performance Summary</h2>
                <p class="node-desc">Kirkpatrick Level 2 Competency Evaluation</p>
              </div>

              <div class="mock-card">
                <div class="mock-body">
                  <p><strong>Final Protocol Integrity Score:</strong> ${state.score}%</p>
                  <br>
                  <p><strong>Evaluated Competencies:</strong></p>
                  <ul style="margin-left: 20px; margin-top: 8px;">
                    <li>Urgency bias resistance: <strong>Demonstrated</strong></li>
                    <li>Out-of-band verification protocol: <strong>Applied</strong></li>
                    <li>SOC incident escalation accuracy: <strong>100%</strong></li>
                  </ul>
                  <br>
                  <p><strong>Case Study Takeaway:</strong> By withholding high-risk data from external drop links and verifying out-of-band, you prevented unauthorized PII exfiltration.</p>
                </div>
              </div>

              <button class="btn-primary" onclick="restartCourse()">Restart Simulation</button>
            </div>
          `;
        },
        onEnter: () => {
          updateHeader(100);
          logTelemetry('completed', 'Protocol Zero Course', { finalScore: state.score, success: state.score >= 80 }, 'info');
        }
      }
    };

    // --- NAVIGATION & INTERACTION CONTROLLER ---
    function goToNode(nodeKey, scoreDelta = 0) {
      if (scoreDelta !== 0) {
        state.score += scoreDelta;
      }
      state.currentNode = nodeKey;
      state.history.push(nodeKey);
      
      const node = nodes[nodeKey];
      const viewport = document.getElementById('viewport');
      viewport.innerHTML = node.render();
      
      if (node.onEnter) {
        node.onEnter();
      }
    }

    function switchToolTab(tab) {
      const tabContent = document.getElementById('tool-tab-display');
      document.querySelectorAll('.tool-tab-btn').forEach(btn => btn.classList.remove('active'));

      if (tab === 'header') {
        document.getElementById('tab-btn-header').classList.add('active');
        state.evidenceGathered.headerChecked = true;
        tabContent.innerHTML = `
          <p><strong>RFC 822 Mail Header Breakdown:</strong></p>
          <pre style="font-family: var(--mono); font-size: 0.8rem; background: var(--bg); padding: 8px; border-radius: 4px; margin-top: 6px; overflow-x: auto;">
Return-Path: &lt;bounce@attacker-host.net&gt;
Received-From: mail-out.meridian-exec-portal.com [198.51.100.42]
DKIM-Signature: NONE (Domain not verified)
From: "Marcus Vance" &lt;m.vance@meridian-exec-portal.com&gt;
Official Corporate Domain: @meridianhealth.com</pre>
          <p style="color: var(--danger); font-size: 0.85rem; margin-top: 8px;"><strong>Finding:</strong> Mismatched sender domain. Attacker registered lookalike domain <code>meridian-exec-portal.com</code>.</p>
        `;
        logTelemetry('investigated', 'RFC 822 Email Headers', { finding: 'Domain Mismatch' });
      } else if (tab === 'url') {
        document.getElementById('tab-btn-url').classList.add('active');
        state.evidenceGathered.urlInspected = true;
        tabContent.innerHTML = `
          <p><strong>Approved Cloud Vendor Registry:</strong></p>
          <ul style="margin-left: 20px; font-size: 0.85rem; margin-top: 6px;">
            <li>✓ <code>https://meridianhealth.box.com</code> (Approved)</li>
            <li>✓ <code>https://files.meridianhealth.com</code> (Approved)</li>
            <li>✗ <code>https://secure-audit.meridian-compliance-review.net</code> (UNRECOGNIZED / UNAPPROVED)</li>
          </ul>
          <p style="color: var(--danger); font-size: 0.85rem; margin-top: 8px;"><strong>Finding:</strong> Target upload destination is an external credential harvester.</p>
        `;
        logTelemetry('inspected', 'Domain Registry Sandbox', { result: 'Unauthorized Host' });
      } else if (tab === 'slack') {
        document.getElementById('tab-btn-slack').classList.add('active');
        state.evidenceGathered.slackVerified = true;
        tabContent.innerHTML = `
          <div style="background: var(--bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border);">
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Direct Message with Marcus Vance (VP Operations)</p>
            <p><strong>You:</strong> <em>"Hi Marcus, verifying if you requested an emergency Q3 contractor SSN export via email just now?"</em></p>
            <p style="margin-top: 6px;"><strong>Marcus Vance:</strong> <em>"Negative. I am currently in a live board review meeting. Do not release any files—forward to SOC immediately."</em></p>
          </div>
          <p style="color: var(--success); font-size: 0.85rem; margin-top: 8px;"><strong>Finding:</strong> Out-of-band verification confirmed identity spoofing attempt.</p>
        `;
        logTelemetry('verified', 'Internal Slack Directory Out-of-Band', { verifiedWithSME: true });
      }
    }

    function handleSocSubmit(event) {
      event.preventDefault();
      const threatType = document.getElementById('threat-type').value;
      const indicator = document.getElementById('indicator').value;
      const action = document.getElementById('verification-channel').value;

      if (threatType === 'spear_phishing' && indicator === 'mismatched_domain' && action === 'out_of_band') {
        logTelemetry('submitted', 'SOC Incident Report', { correct: true, penalty: 0 });
      } else {
        state.score -= 15;
        logTelemetry('submitted', 'SOC Incident Report', { correct: false, penalty: -15 }, 'warn');
      }

      goToNode('node_complete');
    }

    function restartCourse() {
      state.score = 100;
      state.evidenceGathered = { headerChecked: false, urlInspected: false, slackVerified: false };
      state.history = [];
      goToNode('intro');
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', () => {
      goToNode('intro');
    });
  </script>
</body>
</html>
