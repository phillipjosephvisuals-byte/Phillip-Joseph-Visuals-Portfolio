<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/Assets/PJVfavicon.svg?v=3" />
  <link rel="alternate icon" type="image/png" href="/Assets/PJVfavicon1.png?v=3" />
  <link rel="shortcut icon" href="/Assets/PJVfavicon1.png?v=3" />
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructional Systems Design Case Study | Phillip Joseph Villarreal</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;700&display=swap');

    :root {
      --bg-base: #05070a;
      --bg-surface: #0f141d;
      --bg-surface-hover: #171f2c;
      --border-subtle: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38e1ff;
      --accent-glow: rgba(56, 225, 255, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --font-heading: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', "Courier Prime", Consolas, monospace;
      --max-width: 1120px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      position: relative;
      min-height: 100vh;
    }

    /* MULTIPLY VIGNETTE OVERLAY */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(
        circle at 50% 30%, 
        rgba(20, 27, 41, 0.45) 0%, 
        rgba(5, 7, 10, 0.85) 65%, 
        rgba(2, 3, 5, 0.98) 100%
      );
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 0;
    }

    .site-header, main, .site-footer {
      position: relative;
      z-index: 1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img, video {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .section {
      padding: 4.5rem 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    /* --- SITE HEADER & NAV --- */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background-color: transparent;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      border-bottom: 1px solid transparent;
      transition: background-color 0.25s ease, border-color 0.25s ease, backdrop-filter 0.25s ease;
    }

    .site-header.scrolled {
      background-color: rgba(5, 7, 10, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .brand {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.28);
      color: #ffffff;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links > li {
      position: relative;
    }

    .nav-links a {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 0;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--text-main);
    }

    /* DROPDOWN SUB-MENU */
    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 230px;
      background-color: rgba(15, 20, 29, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.6rem 0;
      list-style: none;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(56, 225, 255, 0.1);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.25s ease;
    }

    .dropdown:hover .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-menu li a {
      padding: 0.6rem 1.25rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .dropdown-menu li a:hover, .dropdown-menu li a.active {
      background-color: var(--bg-surface-hover);
      color: var(--accent);
    }

    /* BASE HEADING SELECTOR */
    h1, h2, h3, .brand, .hero-title, .section-title, .card-title {
      font-family: var(--font-heading);
      color: #ffffff;
      text-shadow: 
        0 0 10px rgba(255, 255, 255, 0.28),
        0 0 20px rgba(255, 255, 255, 0.12);
    }

    /* --- HERO SECTION --- */
    .subpage-hero {
      padding: calc(70px + 3rem) 0 4rem 0;
      position: relative;
      background: radial-gradient(
        ellipse 90% 70% at 50% 30%, 
        #141d2b 0%, 
        #0c121d 55%, 
        #05070a 100%
      );
      margin-left: calc(-50vw + 50%);
      margin-right: calc(-50vw + 50%);
      padding-left: calc(50vw - 50%);
      padding-right: calc(50vw - 50%);
      border-bottom: 1px solid var(--border-subtle);
    }

    .subpage-hero::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: linear-gradient(
        to bottom, 
        rgba(5, 7, 10, 0) 0%, 
        rgba(5, 7, 10, 0.8) 70%, 
        #05070a 100%
      );
      pointer-events: none;
    }

    .hero-inner-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      align-items: center;
    }

    @media (min-width: 850px) {
      .hero-grid {
        grid-template-columns: 1.15fr 0.85fr;
      }
    }

    .hero-status-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(56, 225, 255, 0.08);
      border: 1px solid rgba(56, 225, 255, 0.25);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      margin-bottom: 1.25rem;
      width: fit-content;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    .hero-title {
      font-size: clamp(2.1rem, 4vw, 3.2rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .hero-subtitle {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--accent);
      line-height: 1.25;
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .hero-bio {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 1.75rem;
      max-width: 580px;
      text-align: justify;
    }

    .hero-media-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      margin-left: auto;
      margin-right: 0;
      border-radius: 16px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    .hero-media-frame:hover {
      border-color: var(--accent);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-glow);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.5rem 2rem;
      margin-top: 3.5rem;
    }

    .meta-item h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .meta-item p {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    .section-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 800px;
      margin-bottom: 2.5rem;
    }

    /* --- CARDS & GRIDS --- */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 2rem;
      height: 100%;
      transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.4);
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
    }

    .card h3 {
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    .card p, .card ul {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.65;
    }

    .card ul {
      list-style-type: disc;
      padding-left: 1.25rem;
      margin-top: 0.5rem;
    }

    .card ul li {
      margin-bottom: 0.5rem;
    }

    /* ==========================================================================
       CUSTOM INTERACTIVE EMBEDDED COURSE VIEWER
       ========================================================================== */
    .course-player-wrapper {
      position: relative;
      margin-top: 1.5rem;
    }

    .course-player-stage {
      display: flex;
      width: 100%;
      min-height: 640px;
      background-color: #090d14;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 25px rgba(56, 225, 255, 0.08);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .course-player-stage:focus-within, .course-player-stage:hover {
      border-color: rgba(56, 225, 255, 0.4);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 25px rgba(56, 225, 255, 0.15);
    }

    /* TOGGLEABLE SIDEBAR MENU */
    .course-sidebar {
      width: 300px;
      background-color: #0c111a;
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s ease, width 0.3s ease, margin-left 0.3s ease;
      z-index: 20;
    }

    .course-sidebar.collapsed {
      margin-left: -300px;
    }

    .sidebar-header {
      padding: 1.1rem 1.25rem;
      background-color: rgba(15, 20, 29, 0.85);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .sidebar-progress-badge {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      background-color: rgba(56, 225, 255, 0.12);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(56, 225, 255, 0.25);
    }

    .sidebar-tree {
      overflow-y: auto;
      padding: 0.75rem 0;
      list-style: none;
      flex-grow: 1;
    }

    .module-group {
      margin-bottom: 0.4rem;
    }

    .module-heading {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 0.65rem 1.25rem;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .module-heading:hover {
      background-color: var(--bg-surface-hover);
      color: var(--accent);
    }

    .module-heading .caret {
      font-size: 0.7rem;
      transition: transform 0.2s ease;
      color: var(--text-muted);
    }

    .module-group.open .module-heading .caret {
      transform: rotate(90deg);
      color: var(--accent);
    }

    .module-sublist {
      list-style: none;
      background-color: rgba(5, 7, 10, 0.4);
      display: none;
    }

    .module-group.open .module-sublist {
      display: block;
    }

    .module-page-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      padding: 0.5rem 1.25rem 0.5rem 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      position: relative;
    }

    .module-page-item:hover:not(.locked) {
      color: var(--text-main);
      background-color: rgba(23, 31, 44, 0.5);
    }

    .module-page-item.active {
      color: var(--accent);
      background-color: rgba(56, 225, 255, 0.08);
      font-weight: 500;
      border-left: 3px solid var(--accent);
    }

    .module-page-item.completed::after {
      content: "✓";
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--success);
      font-weight: bold;
    }

    .module-page-item.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .module-page-item.locked::after {
      content: "🔒";
      margin-left: auto;
      font-size: 0.7rem;
    }

    /* MAIN VIEWPORT CANVAS */
    .course-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 60% 30%, #111827 0%, #080c14 100%);
      position: relative;
      overflow: hidden;
      min-width: 0;
      max-height: 720px;
    }

    .viewport-topbar {
      height: 52px;
      padding: 0 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      background-color: rgba(15, 20, 29, 0.65);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .menu-toggle-btn {
      background-color: rgba(23, 31, 44, 0.6);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }

    .menu-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background-color: var(--bg-surface-hover);
    }

    .current-slide-indicator {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .viewport-content {
      flex: 1;
      padding: 2.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
      scroll-behavior: smooth;
    }

    .slide-container {
      display: none;
      flex-direction: column;
      animation: fadeInSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slide-container.active {
      display: flex;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .slide-title {
      font-size: clamp(1.4rem, 2.5vw, 1.85rem);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1.25rem;
      line-height: 1.25;
    }

    .slide-body {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.75;
      margin-bottom: 1.5rem;
      max-width: 780px;
    }

    .slide-body strong {
      color: var(--text-main);
    }

    .content-box {
      background-color: rgba(15, 20, 29, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      max-width: 780px;
    }

    .content-box h4 {
      font-size: 0.95rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-family: var(--font-heading);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .content-box ul {
      list-style-type: disc;
      padding-left: 1.25rem;
      color: var(--text-muted);
      font-size: 0.925rem;
    }

    .content-box ul li {
      margin-bottom: 0.4rem;
    }

    /* TIMELINE SVG WRAPPER */
    .timeline-visual-card {
      background-color: rgba(15, 20, 29, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      max-width: 780px;
    }

    .timeline-visual-card h4 {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }

    .timeline-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* QUIZ & EXAM STYLES */
    .quiz-question-block {
      background-color: rgba(15, 20, 29, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.75rem;
      max-width: 780px;
    }

    .quiz-question-stem {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 1rem;
    }

    .choice-stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .choice-card {
      background-color: rgba(10, 14, 22, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.85rem 1.15rem;
      cursor: pointer;
      color: var(--text-main);
      font-size: 0.9rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-align: left;
    }

    .choice-card:hover:not(.disabled) {
      border-color: var(--accent);
      background-color: var(--bg-surface-hover);
      transform: translateX(4px);
    }

    .choice-letter {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.08);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .choice-card.correct {
      border-color: var(--success) !important;
      background-color: rgba(16, 185, 129, 0.12) !important;
    }

    .choice-card.incorrect {
      border-color: var(--danger) !important;
      background-color: rgba(239, 68, 68, 0.12) !important;
    }

    .choice-card.disabled {
      cursor: default;
    }

    .scenario-feedback {
      padding: 0.85rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-top: 0.75rem;
      display: none;
    }

    .scenario-feedback.active {
      display: block;
      animation: fadeInSlide 0.2s ease;
    }

    .scenario-feedback.correct {
      background-color: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--success);
      color: #a7f3d0;
    }

    .scenario-feedback.incorrect {
      background-color: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--danger);
      color: #fecaca;
    }

    /* VIEWPORT FOOTER NAVIGATION */
    .viewport-footer {
